name: Deploy static content to Pages

on:
  push:
    branches: ["v2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v4.1.0
      
      - name: Install npm dependencies
        run: npm ci
      
      - name: Run npm build
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload build output for update job
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist

  update:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: NckHmml/NckHmml.github.io
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: target-repo

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target-repo

      - name: Copy index.html to 404.html
        run: cp target-repo/index.html target-repo/404.html

      - name: Commit and push changes
        run: |
          cd target-repo
          git config --global user.name "NckHmml[bot]"
          git config --global user.email "NckHmml@users.noreply.github.com"
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push origin master